name: Autobuild

# Runs on every PR into main and every push to main. Push-to-main additionally
# reads the version straight out of Cargo.toml and, only if that
# version hasn't been released yet, builds the full bundle and cuts a tag +
# draft release (release notes pulled from the matching CHANGELOG.md
# section). Everything else -- PRs, or a push to main that didn't bump the
# version -- just gets fmt/clippy/test/build as a sanity check.
#
# To trigger an actual release: bump the version in Cargo.toml and
# tauri.conf.json, promote CHANGELOG.md's "Unreleased" section to that
# version, commit, and merge to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            bubblewrap

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Read version from Cargo.toml
        id: version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version has already been released
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section for this version
        if: github.event_name == 'push' && steps.check_tag.outputs.should_release == 'true'
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          notes="$(awk -v ver="$version" '
            BEGIN { found=0 }
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "${notes// }" ]; then
            notes="No changelog entry found for $version."
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # PRs, and any push to main that isn't a fresh version bump, just get a
      # plain build to confirm nothing's broken -- no tag, no release.
      - name: Build only
        if: "!(github.event_name == 'push' && steps.check_tag.outputs.should_release == 'true')"
        run: cargo build --release

      - name: Build bundle and create draft release
        if: github.event_name == 'push' && steps.check_tag.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "v${{ steps.version.outputs.version }}"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: false
