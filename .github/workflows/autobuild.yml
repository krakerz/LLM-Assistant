name: Autobuild

# Runs only on pushes to main -- a PR being opened/updated does not trigger
# this at all. Reads the version straight out of Cargo.toml and, only if
# that version hasn't been released yet, builds the full bundle and cuts a
# tag + draft release (release notes pulled from the matching CHANGELOG.md
# section). A push that didn't bump the version just gets fmt/clippy/test/
# build as a sanity check.
#
# To trigger an actual release: bump the version in Cargo.toml and
# tauri.conf.json, promote CHANGELOG.md's "Unreleased" section to that
# version, commit, and merge to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/autobuild.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            bubblewrap

      # The sandbox tests actually run bwrap, and bwrap's --unshare-net
      # brings up loopback inside the new netns -- which Ubuntu 24.04 refuses
      # for unprivileged user namespaces by default, failing with
      # "bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted".
      # Relaxing the AppArmor restriction here is what lets those tests run
      # for real rather than skip themselves (see `sandbox_available` in
      # src/sandbox.rs). Not fatal if it doesn't take: the probe line in the
      # test output is where you find out they were skipped.
      - name: Allow unprivileged user namespaces (needed by bwrap)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "bwrap sandbox probe:"
          bwrap --unshare-all --ro-bind / / /bin/true \
            && echo "  OK -- sandbox tests will run" \
            || echo "  UNAVAILABLE -- sandbox tests will skip themselves"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Read version from Cargo.toml
        id: version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version has already been released
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section for this version
        if: steps.check_tag.outputs.should_release == 'true'
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          notes="$(awk -v ver="$version" '
            BEGIN { found=0 }
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "${notes// }" ]; then
            echo "::error::CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # A push to main that isn't a fresh version bump just gets a plain
      # build to confirm nothing's broken -- no tag, no release.
      - name: Build only
        if: steps.check_tag.outputs.should_release != 'true'
        run: cargo build --release

      - name: Build bundle and create draft release
        id: release
        if: steps.check_tag.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "v${{ steps.version.outputs.version }}"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: false

      # The .deb declares bubblewrap so apt handles it, but an AppImage user
      # gets no such hint -- and without bwrap every command fails. INSTALL.txt
      # rides along as its own asset so the download is usable on its own.
      - name: Attach INSTALL.txt to the draft release
        if: steps.check_tag.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.version.outputs.version }}" INSTALL.txt --clobber
