name: Autobuild

# Runs only on pushes to main -- a PR being opened/updated does not trigger
# this at all. `paths-ignore` below also skips it entirely for a push that
# only touches docs/metadata with nothing to build or test -- a README fix
# alone isn't worth a CI run. Reads the version straight out of Cargo.toml
# and, only if that version hasn't been released yet, builds the full bundle
# and cuts a tag + draft release (release notes pulled from the matching
# CHANGELOG.md section). A push that didn't bump the version just gets
# fmt/clippy/test/build as a sanity check.
#
# To trigger an actual release: bump the version in Cargo.toml and
# tauri.conf.json, promote CHANGELOG.md's "Unreleased" section to that
# version, commit, and merge to main -- Cargo.toml changing is real source,
# so that push always runs regardless of what else is also in it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "INSTALL.txt"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the changelog fallback below reads commit
          # subjects since the previous tag, and a shallow clone has neither.
          fetch-depth: 0

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/autobuild.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            bubblewrap

      # The sandbox tests actually run bwrap, and bwrap's --unshare-net
      # brings up loopback inside the new netns -- which Ubuntu 24.04 refuses
      # for unprivileged user namespaces by default, failing with
      # "bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted".
      # Relaxing the AppArmor restriction here is what lets those tests run
      # for real rather than skip themselves (see `sandbox_available` in
      # src/sandbox.rs). Not fatal if it doesn't take: the probe line in the
      # test output is where you find out they were skipped.
      - name: Allow unprivileged user namespaces (needed by bwrap)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "bwrap sandbox probe:"
          bwrap --unshare-all --ro-bind / / /bin/true \
            && echo "  OK -- sandbox tests will run" \
            || echo "  UNAVAILABLE -- sandbox tests will skip themselves"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Read version from Cargo.toml
        id: version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version has already been released
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section for this version
        if: steps.check_tag.outputs.should_release == 'true'
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          notes="$(awk -v ver="$version" '
            BEGIN { found=0 }
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          # No changelog section is not fatal -- rough notes beat no release.
          # Fall back to commit subjects since the previous tag.
          if [ -z "${notes// }" ]; then
            echo "::warning::no CHANGELOG.md section for $version, using commit history"
            prev="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            [ -n "$prev" ] && range="$prev..HEAD" || range="HEAD"
            log="$(git log --no-merges --pretty=format:'- %s' "$range" | head -50)"
            [ -n "$log" ] || log="- (no commits found)"
            header="_No changelog entry for $version; notes generated from commit history._"
            notes="$(printf '%s\n\n%s' "$header" "$log")"
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # A push to main that isn't a fresh version bump just gets a plain
      # build to confirm nothing's broken -- no tag, no release.
      - name: Build only
        if: steps.check_tag.outputs.should_release != 'true'
        run: cargo build --release

      - name: Build bundle and create draft release
        id: release
        if: steps.check_tag.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "v${{ steps.version.outputs.version }}"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: true
          prerelease: false

      # The .deb declares bubblewrap so apt handles it, but an AppImage user
      # gets no such hint -- and without bwrap every command fails. INSTALL.txt
      # rides along as its own asset so the download is usable on its own.
      # SHA256SUMS covers every asset, computed from the files this job
      # actually built.
      - name: Attach INSTALL.txt and checksums to the draft release
        if: steps.check_tag.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACTS: ${{ steps.release.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # tauri-action reports what it uploaded as a JSON array; fall back to
          # the bundle tree if that output is ever missing or empty.
          if [ -n "${ARTIFACTS:-}" ] && [ "$(printf '%s' "$ARTIFACTS" | jq 'length')" -gt 0 ]; then
            printf '%s' "$ARTIFACTS" | jq -r '.[]' | while IFS= read -r f; do
              [ -f "$f" ] && cp -- "$f" dist/
            done
          else
            # Version-matched: a dirty tree can hold bundles from older builds,
            # and a checksum over one of those would be a lie about this release.
            find target/release/bundle -type f -name "*${VERSION}*" \
              \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
              -exec cp -- {} dist/ \;
          fi
          cp INSTALL.txt dist/
          ( cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS )
          gh release upload "$TAG" INSTALL.txt dist/SHA256SUMS --clobber
