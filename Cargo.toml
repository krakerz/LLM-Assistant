[package]
name = "llm-assistant"
version = "2.0.0"
description = "Chat-driven local file assistant, sandboxed to a chosen folder"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "deflate", "stream"] }
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "time", "io-util"] }
regex = "1"
tokio-stream = { version = "0.1", default-features = false }
anyhow = "1"
shell-words = "1"
log = "0.4"
simplelog = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
rust-embed = "8"
mime_guess = "2"
getrandom = "0.2"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "llm-assistant"
path = "src/main.rs"
