[package]
name = "llm-assistant"
version = "1.11.0"
description = "Chat-driven local file assistant, sandboxed to a chosen folder"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
anyhow = "1"
shell-words = "1"
log = "0.4"
simplelog = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"

[[bin]]
name = "llm-assistant"
path = "src/main.rs"
